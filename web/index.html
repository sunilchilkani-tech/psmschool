  <title>Professional School Management</title>
  <script src="protect.js?v=8"></script>
  <script>
    (function () {
      if (window.__psmZoomHookInstalled) return;
      window.__psmZoomHookInstalled = true;
      window.addEventListener('wheel', function (e) {
        if (!(e.ctrlKey || e.metaKey)) return;
        e.preventDefault();
        e.stopPropagation();
        var dy = e.deltaY || 0;
        if (Math.abs(dy) < 0.01) return;
        window.postMessage(dy < 0 ? 'PSM_ZOOM_IN_WHEEL' : 'PSM_ZOOM_OUT_WHEEL', '*');
      }, { capture: true, passive: false });
      window.addEventListener('keydown', function (e) {
        var ctrl = e.ctrlKey || e.metaKey;
        if (!ctrl || e.altKey) return;
        var key = e.key || '';
        var code = e.code || '';
        if (key === '+' || key === '=' || code === 'Equal' || code === 'NumpadAdd') {
          e.preventDefault();
          e.stopPropagation();
          window.postMessage('PSM_ZOOM_IN_KEY', '*');
          return false;
        }
        if (key === '-' || key === '_' || code === 'Minus' || code === 'NumpadSubtract') {
          e.preventDefault();
          e.stopPropagation();
          window.postMessage('PSM_ZOOM_OUT_KEY', '*');
          return false;
        }
        if (key === '0' || code === 'Digit0' || code === 'Numpad0') {
          e.preventDefault();
          e.stopPropagation();
          window.postMessage('PSM_ZOOM_RESET_KEY', '*');
          return false;
        }
      }, { capture: true, passive: false });
    })();
  </script>
  <link rel="manifest" href="manifest.json">

  <link rel="preconnect" href="https://fonts.googleapis.com/">
  <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin>
  <!-- Non-blocking: the app bundles its own Gujarati fonts; this stylesheet
       only styles the loading screen, so it must not delay the first paint. -->
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&family=Noto+Sans+Gujarati:wght@600;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <link href="flutter_bootstrap.js" rel="preload" as="script">

  <style>
    html, body { height: 100%; background: #1a2744; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    input, textarea { -webkit-user-select: text; user-select: text; }
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      background: linear-gradient(135deg,#1a2744 0%,#243560 60%,#2f4580 100%);
      font-family: Nunito, "Noto Sans Gujarati", sans-serif;
    }
    #loading img { width: 156px; height: 156px; object-fit: contain; box-sizing: border-box; padding: 7px; border-radius: 18px; background: #fff; box-shadow: 0 8px 24px rgba(0,0,0,0.18); }
    #loading .spin {
      width: 30px; height: 30px; border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.25); border-top-color: #f5a623;
      animation: spin 0.8s linear infinite;
    }
    #loading .txt { color: rgba(255,255,255,0.85); font-size: 13px; font-weight: 700; letter-spacing: .3px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">

    <div class="spin"></div>
    <div class="txt">School Management લોડ થાય છે…</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
