analyzer:
  exclude:
    - build/**
    - android/**
    - web/**
    - backups/**
    - PSM_*/**
    - lib/screens/exam_tabs/**
    - lib/screens/id_card_tabs/**
    - lib/screens/rojmel_tabs/**
    - lib/screens/timetable_tabs/**
    # Raw source files shared for integration (integrated versions live in lib/).
    - new-files-for-claude/**
  errors:
    deprecated_member_use: ignore
    invalid_use_of_protected_member: ignore
    invalid_use_of_visible_for_testing_member: ignore
    unused_import: ignore
    unused_local_variable: ignore
    unused_element: ignore
    unused_element_parameter: ignore
    unused_field: ignore
    unnecessary_import: ignore
    unnecessary_non_null_assertion: ignore
    unnecessary_null_comparison: ignore
    unnecessary_type_check: ignore
    invalid_null_aware_operator: ignore
include: package:flutter_lints/flutter.yaml

linter:
  rules:
    prefer_const_constructors: false
    prefer_const_declarations: false
    prefer_const_literals_to_create_immutables: false
    prefer_null_aware_operators: false
    prefer_conditional_assignment: false
    prefer_function_declarations_over_variables: false
    prefer_is_empty: false
    unnecessary_const: false
    unnecessary_string_escapes: false
    unnecessary_string_interpolations: false
    use_key_in_widget_constructors: false
    curly_braces_in_flow_control_structures: false
    prefer_final_fields: false
    prefer_interpolation_to_compose_strings: false
    unnecessary_brace_in_string_interps: false
    unnecessary_to_list_in_spreads: false
    use_build_context_synchronously: false
    avoid_web_libraries_in_flutter: false
    dangling_library_doc_comments: false
    constant_identifier_names: false
    non_constant_identifier_names: false
    library_private_types_in_public_api: false
    empty_catches: false
    depend_on_referenced_packages: false
