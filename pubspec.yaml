name: pmshri_attendance
description: "Multi-school attendance, student management, and result reporting"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Excel: retain both packages for existing and newer screens
  excel_community: ^2.6.0

  # PDF creation and printing
  pdf: ^3.12.0
  printing: ^5.14.3

  # Legacy Apps Script transport
  http: ^1.2.0

  # Firebase backend
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_functions: ^6.5.0
  cloud_firestore: ^6.10.0
  # Local persistence and state management
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.2.4
  provider: ^6.1.2

  # Fonts and dates
  google_fonts: ^6.2.1
  intl: ^0.19.0

  # WhatsApp, file handling and sharing
  url_launcher: ^6.3.1
  file_picker: ^8.3.7
  share_plus: ^12.0.2
  cross_file: ^0.3.5+5

  cupertino_icons: ^1.0.6

  # ID Card Studio
  webview_flutter: ^4.13.0
  webview_flutter_android: ^4.14.1
  universal_html: 2.3.0

  archive: ^4.5.2
  xml: ^7.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/result_templates/RESULT_2026_27_TEMPLATE.xlsx
    - assets/hajari_patrak/hajari_patrak_template.xlsx
    - assets/hajari_patrak/
    - assets/report_templates/datewise_template.xlsx
    - assets/report_templates/tarij_combined_template.xlsx
    - assets/filebeam_pro.html
    - assets/fonts/NotoSansGujarati-Regular.ttf
    - assets/fonts/NotoSansGujarati-Bold.ttf
    - assets/fonts/Lohit-Gujarati.ttf
    - assets/fonts/NotoSansGujarati-ExtraBold.ttf
    - assets/fonts/pm/
    - assets/images/app_icon_padded.png
    - assets/images/bonafide.png
    - assets/images/lc.png
    - assets/images/leave1.png
    - assets/images/leave2.png
    - assets/images/leave1.jpg
    - assets/images/leave2.jpg

  fonts:
    - family: NotoSansGujaratiLocal
      fonts:
        - asset: assets/fonts/NotoSansGujarati-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansGujarati-Bold.ttf
          weight: 700
        - asset: assets/fonts/NotoSansGujarati-ExtraBold.ttf
          weight: 800

    - family: LohitGujaratiLocal
      fonts:
        - asset: assets/fonts/Lohit-Gujarati.ttf
          weight: 400

flutter_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon_padded.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_icon_padded.png"

